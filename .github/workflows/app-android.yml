name: Application Flutter (Android)

on:
  push:
    paths: ["app/**", ".github/workflows/app-android.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app-android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: APK de test
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: cavi-medias-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
